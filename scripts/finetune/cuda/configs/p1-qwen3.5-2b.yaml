# p1 (pilot): the h1 rows plus 370 invented muddled dictations with rewrite-to-intent labels (each twice), under their own instruction.
# 1024 holds: rough longest row 718 tokens (manifest).
# RTX 4070 Super 12 GB: bf16 LoRA, batch 2 x accum 8 (effective 16).
base_model: Qwen/Qwen3.5-2B
data_dir: ../data-p1
output_dir: runs/p1-qwen3.5-2b
quantization: none
lora: {rank: 32, alpha: 64, dropout: 0.05}
train: {epochs: 2, learning_rate: 1.0e-4, batch_size: 2, grad_accumulation_steps: 8, max_seq_length: 1024, patience: 3, seed: 7}
