# Voice actions tools data v2 (hushy-tools-synth-v2: 6,010 tool rows + 40% cleanup replay, docs/product/FINETUNE.md §2.10)
# on top of the winning cleanup 2B. base_model: point it at that run's merged/ before launching
# (v5.2 is the default guess; the cleanup replay in the data must come from the same round —
# rebuild the data with that round's pairs.jsonl, ~45 s from the LLM cache).
# 1.5 epochs: T1's validation loss was flat after ~1.3 epochs (§3.26). ~866 steps at ~5.7 s ≈ 80 min.
base_model: runs/v5.2-qwen3.5-2b/merged
data_dir: ../data-tools-v2
output_dir: runs/qwen3.5-2b-tools-v2
quantization: none
lora: {rank: 32, alpha: 64, dropout: 0.05}
train: {epochs: 1.5, learning_rate: 1.0e-4, batch_size: 1, grad_accumulation_steps: 16, max_seq_length: 1792,
        answer_only_logits: true, max_valid_rows: 320, eval_steps: 100, patience: 3, seed: 7}
