# Dataset v5.1 (compact-v2; 2 epochs: the v4 0.8B was still improving at the end, ~/hushy-train/data-v5.1).
# RTX 4070 Super 12 GB: bf16 LoRA, batch 4 x accum 4 (effective 16). Est. peak ~6.5 GB.
base_model: Qwen/Qwen3.5-0.8B
data_dir: ../data-v5.1
output_dir: runs/v5.1-qwen3.5-0.8b
quantization: none
lora: {rank: 16, alpha: 32, dropout: 0.05}
train: {epochs: 2, learning_rate: 1.5e-4, batch_size: 4, grad_accumulation_steps: 4, max_seq_length: 512, patience: 3, seed: 7}
