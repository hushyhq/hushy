# Experiment g3: the g2 rows with a short right context (first words of the next group) in the user turn.
# 1024 holds: g1 had no row over it by the real tokenizer; check the manifest again for g2.
# RTX 4070 Super 12 GB: bf16 LoRA, batch 2 x accum 8 (effective 16).
base_model: Qwen/Qwen3.5-2B
data_dir: ../data-g3
output_dir: runs/g3-qwen3.5-2b
quantization: none
lora: {rank: 32, alpha: 64, dropout: 0.05}
train: {epochs: 2, learning_rate: 1.0e-4, batch_size: 2, grad_accumulation_steps: 8, max_seq_length: 1024, patience: 3, seed: 7}
