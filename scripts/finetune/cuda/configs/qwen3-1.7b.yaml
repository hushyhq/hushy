# RTX 4070 Super 12 GB: bf16 LoRA, batch 4 x accum 4 (effective 16). Est. peak ~7.5 GB
# (Qwen3 has a 152k vocabulary, so the logits term is ~60% of Qwen3.5s).
base_model: Qwen/Qwen3-1.7B
data_dir: ../data
output_dir: runs/qwen3-1.7b
quantization: none
lora: {rank: 32, alpha: 64, dropout: 0.05}
train: {epochs: 2, learning_rate: 1.0e-4, batch_size: 4, grad_accumulation_steps: 4, max_seq_length: 512, patience: 3, seed: 7}
