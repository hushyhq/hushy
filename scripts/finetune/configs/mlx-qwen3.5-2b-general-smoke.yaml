# One-iteration resource/template probe; no quality or promotion claim.
# Existing cached2B4bit, reviewed general whole-text data. Full training prefers CUDA.
fine_tune_type: lora
train: true
mask_prompt: true
num_layers: 4
batch_size: 1
iters: 1
val_batches: 2
learning_rate: 1.0e-4
steps_per_report: 1
steps_per_eval: 1
save_every: 1
max_seq_length: 512
grad_checkpoint: true
seed: 17
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 2.0
